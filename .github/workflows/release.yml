name: Publish DSH release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Check version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import p from './package.json' with {type:'json'}; if(process.env.RELEASE_TAG !== 'v'+p.version) throw new Error('Tag/package mismatch')"
      - run: npm run build
      - run: npm run pack:release
      - name: Publish independent DSH package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/dsh-furry-partner-*.tgz dist/*.sha256 dist/*.report.json --verify-tag --latest=false --title "DSH Furry Partner $GITHUB_REF_NAME" --notes "Standalone DSH distribution. See README for migration and source provenance."
